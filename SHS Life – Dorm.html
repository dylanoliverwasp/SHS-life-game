<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#1b1f3a;--card:#ffffffee;--ink:#1b1f3a;--acc:#ff8a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#nav div{flex:1;background:var(--card);text-align:center;padding:9px 0;border-radius:14px;font-size:12px;font-weight:800;cursor:pointer}

#ob{position:fixed;inset:0;z-index:9;background:linear-gradient(160deg,#1b1f3a,#3a2a6a);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}

.top{display:flex;justify-content:space-between;align-items:center}
.lnk{background:none;border:0;font-weight:700;font-size:13px;color:#1b1f3a99;cursor:pointer;padding:4px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 14px;border-radius:14px;border:2px solid #e3e3ee;background:#fff;font-size:15px;font-weight:700;cursor:pointer;color:#1b1f3a}
.opt:active,.opt.sel{border-color:var(--acc);background:#fff3e6}
.go{display:block;width:100%;margin-top:12px;padding:14px;border-radius:14px;border:0;background:var(--acc);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
#obc input{width:100%;box-sizing:border-box;padding:13px;border-radius:14px;border:2px solid #e3e3ee;font-size:16px;font-weight:700;color:#1b1f3a;background:#fff}

#ob{flex-direction:column;gap:6px}#pv{width:100%;max-width:400px;height:200px;flex:none}#pv canvas{width:100%!important;height:100%!important}

 <div class="row"><div class="pill" id="clock">6:00 AM</div><div class="pill" id="mood">😊</div><div class="pill btn" id="snd">🔊</div><div class="sp"></div><div class="pill">₵ <span id="cash">50</span> <span class="btn" id="add" style="color:var(--acc);cursor:pointer">＋</span></div></div>

<script>
const S={Academics:40,Energy:70,Social:30,Discipline:50},COL={Academics:'#4aa3ff',Energy:'#ffc83d',Social:'#ff6fae',Discipline:'#52d273'};
let cash=50,mins=360;
const $=id=>document.getElementById(id);

 const e=S.Energy;$('mood').textContent=e>60?'😊':e>30?'😐':'😴'}

 [[-1.15,-.6],[1.15,-.6],[-1.15,.6],[1.15,.6]].forEach(p=>box(.12,2.9,.12,0x5a3a1b,p[0],1.45,p[1],g));
 box(2.4,.08,.08,0x5a3a1b,0,2.9,-.6,g);box(2.4,.08,.08,0x5a3a1b,0,2.9,.6,g);
 box(.08,.9,.08,0x5a3a1b,1.15,2.4,0,g);
 for(let k=0;k<5;k++)box(.08,.06,1.2,0x8a5a2b,1.15+.0,.4+k*.5,.0,g).scale.set(1,1,.25); // ladder rungs
 for(let l=0;l<2;l++){const i=f*2+l;if(i>14)continue;const mine=i===you,y=.5+l*1.4;
  box(2.3,.14,1.15,0x6b4a2b,0,y,0,g);
  const m=box(2.2,.22,1.05,mine?0xff8a1f:(l?0x7f8fc4:0x5c7fb8),0,y+.18,0,g);
  const pl=box(.6,.16,.8,0xffffff,-.75,y+.37,0,g);
  if(l)box(2.3,.3,.06,0x5a3a1b,0,y+.3,.58,g); // top bunk guard rail
  if(mine){youG=g;youLvl=l;[m,pl].forEach(o=>{o.userData.act='bed';pick.push(o)})}}
 if(f===you>>1)kwF=f^1;}
const kwG={x:0,z:-5.4+(kwF>>1)*2.5};

function person(color,x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.32,.38,1.1,14),mat(color));b.position.y=.65;b.castShadow=true;g.add(b);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.3,14,14),mat(0x6b4226));h.position.y=1.5;h.castShadow=true;g.add(h);return g}

kwame.children.forEach(o=>{o.userData.act='kwame';pick.push(o)});
// desk & bucket
const desk=new THREE.Group();desk.position.set(4.3,0,6);scene.add(desk);
box(1.8,.12,1,0x8a5a2b,0,1,0,desk);[[-.8,-.4],[.8,-.4],[-.8,.4],[.8,.4]].forEach(p=>box(.1,1,.1,0x5a3a1b,p[0],.5,p[1],desk));
box(.7,.12,.5,0xe74c3c,0,1.1,0,desk);
desk.children.forEach(o=>{o.userData.act='desk';pick.push(o)});
const bk=new THREE.Group();bk.position.set(-4.4,0,6.2);scene.add(bk);
const bm=new THREE.Mesh(new THREE.CylinderGeometry(.5,.38,.8,16),mat(0x2e86de));bm.position.y=.4;bm.castShadow=true;bk.add(bm);
const wt=new THREE.Mesh(new THREE.CylinderGeometry(.44,.44,.02,16),mat(0x8ed1ff));wt.position.y=.78;bk.add(wt);
bk.children.forEach(o=>{o.userData.act='bucket';pick.push(o)});

let target=null;
// marker ring above your bed
const ring=new THREE.Mesh(new THREE.TorusGeometry(.35,.08,8,20),mat(0xffffff));ring.rotation.x=Math.PI/2;ring.position.set(youG.position.x,3.5,youG.position.z);scene.add(ring);
// "YOU" label sprite
const cv=document.createElement('canvas');cv.width=128;cv.height=64;const cx=cv.getContext('2d');cx.fillStyle='#ff8a1f';cx.beginPath();cx.roundRect?cx.roundRect(4,8,120,48,16):cx.rect(4,8,120,48);cx.fill();cx.fillStyle='#fff';cx.font='bold 34px sans-serif';cx.textAlign='center';cx.fillText('YOU',64,44);
const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv)}));sp.scale.set(1.6,.8,1);sp.position.set(youG.position.x,4.3,youG.position.z);scene.add(sp);

// interaction
const ACT={
 bed:()=>{S.Energy=Math.min(100,S.Energy+25);mins+=60;toast((youLvl?'🪜 Climbed to your top bunk':'🛏️ Bottom bunk')+' · Energy +25')},
 desk:()=>{if(S.Energy<10)return toast('Too tired to study!');S.Academics=Math.min(100,S.Academics+15);S.Energy-=10;toast('📚 Prep done · Academics +15')},
 bucket:()=>{S.Discipline=Math.min(100,S.Discipline+10);S.Energy-=5;toast('🪣 Fetched water · Discipline +10')},
 kwame:()=>{S.Social=Math.min(100,S.Social+15);toast('💬 Kwame: "Eii, you dey!" · Social +15')}
};
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
let drag=null,moved=0;
const cvs=R.domElement;
cvs.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);ang-=dx*.006;pol=Math.max(.6,Math.min(1.35,pol+dy*.004));drag={x:e.clientX,y:e.clientY};setCam()});
addEventListener('pointerup',e=>{if(!drag)return;drag=null;if(moved>6)return;
 mv.set(e.clientX/W()*2-1,-(e.clientY/H())*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(pick,false)[0];
 if(h){const a=h.object.userData.act,p=h.object.parent===scene?h.object.position:h.object.parent.position;
  target=a==='bed'?{x:p.x>0?p.x-1.8:p.x+1.8,z:p.z,a}:{x:p.x,z:p.z+1.4,a}}});
cvs.addEventListener('wheel',e=>{dist=Math.max(14,Math.min(40,dist+e.deltaY*.02));setCam();e.preventDefault()},{passive:false});
let t0=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-t0)/1000);t0=t;
 if(target){const dx=target.x-me.position.x,dz=target.z-me.position.z,d=Math.hypot(dx,dz);
  if(d<.15){const a=target.a;target=null;ACT[a]();drawStats();$('cash').textContent=cash}
  else{me.position.x+=dx/d*Math.min(d,5*dt);me.position.z+=dz/d*Math.min(d,5*dt);me.position.y=Math.abs(Math.sin(t*.012))*.12}}
 else me.position.y=0;
 ring.position.y=3.5+Math.sin(t*.004)*.12;ring.rotation.z+=.03;
 kwame.position.y=Math.abs(Math.sin(t*.003))*.05;
 R.render(scene,cam)}
resize();loop(0);

// ---- Onboarding ----
const SK=[0xf1c9a5,0xd9a066,0xa86b3f,0x7a4a2a,0x4a2c16],OF=[0xf4f4f4,0x3b7bd4,0x2ecc71,0xe74c3c];
const ST={g:'M',skin:3,hair:0,outf:0,agg:12,school:'',cat:'',prog:'',house:'',nick:'',style:''};let step=0,RM='Kwame';
const cy=(rt,rb,h,m,x,y,g)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,14),m);o.position.set(x,y,0);o.castShadow=true;g.add(o);return o};

 if(F){cy(.3,.52,.65,bl,0,.75,g);[-.13,.13].forEach(x=>cy(.07,.07,.5,sk,x,.25,g))}else[-.14,.14].forEach(x=>cy(.1,.1,.95,bl,x,.48,g));
 cy(.3,.34,.8,u,0,1.35,g);[-.43,.43].forEach(x=>{const a=cy(.07,.07,.7,sk,x,1.3,g);a.rotation.z=x>0?-.15:.15});
 sph(.33,sk,0,1.98,0,g);[-.11,.11].forEach(x=>sph(.04,mat(0x111111),x,2.02,.3,g));
 const m=new THREE.Mesh(new THREE.TorusGeometry(.07,.015,6,12,Math.PI),mat(0x8a2a2a));m.position.set(0,1.93,.32);m.rotation.z=Math.PI;g.add(m);
 if(c.hair==0)sph(.35,hr,0,2.03,-.04,g).scale.set(1,.7,1);

 if(c.hair==2){sph(.35,hr,0,2.03,-.04,g).scale.set(1,.7,1);if(F)[-.3,.3].forEach(x=>sph(.15,hr,x,2.3,0,g));else cy(.2,.22,.3,hr,0,2.35,g)}
 return g}
// preview

const ps=new THREE.Scene(),pc=new THREE.PerspectiveCamera(35,1.5,.1,50);pc.position.set(0,2.4,6.2);pc.lookAt(0,1.2,0);
ps.add(new THREE.HemisphereLight(0xffffff,0x667799,.9));const pl=new THREE.DirectionalLight(0xffffff,.7);pl.position.set(3,5,4);ps.add(pl);

const SCH={A:{M:["Prempeh College","Mfantsipim School","Opoku Ware School"],F:["Wesley Girls' High","Holy Child School","Aburi Girls' SHS"]},B:{M:["Ghana National College","St. Peter's SHS"],F:["Mfantsiman Girls' SHS","Aggrey Memorial SHS"]},C:{M:["Sekyere Community SHS","Nsawam Day SHS"],F:["Akim Community SHS","Mampong Girls' SHS"]}};

const sw=(arr,k)=>`<div class="sw">${arr.map((c,i)=>`<i class="${ST[k]===i?'sel':''}" style="background:#${c.toString(16).padStart(6,'0')}" onclick="set('${k}',${i})"></i>`).join('')}</div>`;
function set(k,v){ST[k]=v;if(k=='g'){ST.hair=0}rb();draw()}
function head(t,p){return `<div class="top"><span class="stp">STEP ${step+1} OF 8</span><span>${step?'<button class="lnk" onclick="goBack()">← Back</button>':''}<button class="lnk" onclick="rs()">Restart</button></span></div><h2>${t}</h2><p>${p}</p>`}
function opts(list,key){return list.map(o=>`<button class="opt ${ST[key]===o?'sel':''}" onclick="pk('${key}',this.dataset.v)" data-v="${o}">${o}</button>`).join('')}
function pk(k,v){ST[k]=v;step++;draw()}
function goBack(){step--;draw()}
function rs(){Object.assign(ST,{g:'M',skin:3,hair:0,outf:0,agg:12,school:'',prog:'',house:'',nick:'',style:''});step=0;rb();draw()}
function nx(){step++;draw()}
function sub(v){ST.agg=+v;$('ag').textContent=v;$('ct').textContent=CN[cat(+v)]+' school'}
function place(){const L=SCH[cat(ST.agg)][ST.g];ST.school=L[Math.floor(Math.random()*L.length)];nx()}
function rnick(){ST.nick=NICK[Math.floor(Math.random()*NICK.length)];draw()}
function draw(){const G=ST.g,F=G=='F';let h='';
 if(step==0)h=head('Who are you in this story?','Customise your character. This decides your house and boarding placement.')+`<div class="two"><button class="opt ${F?'':'sel'}" onclick="set('g','M')">👦🏾 Male</button><button class="opt ${F?'sel':''}" onclick="set('g','F')">👧🏾 Female</button></div><div class="lb">Skin tone</div>${sw(SK,'skin')}<div class="lb">Hair</div><div class="two">${['Low cut',"Afro",F?'Buns':'High-top'].map((n,i)=>`<button class="opt ${ST.hair==i?'sel':''}" onclick="set('hair',${i})">${n}</button>`).join('')}</div><div class="lb">Shirt colour</div>${sw(OF,'outf')}<button class="go" onclick="nx()">Looks good →</button>`;
 if(step==1)h=head('Your BECE results','Slide to set your aggregate. Lower is better!')+`<p class="big" id="ag">${ST.agg}</p><input type="range" min="6" max="30" value="${ST.agg}" oninput="sub(this.value)"><p style="text-align:center;font-weight:800" id="ct">${CN[cat(ST.agg)]} school</p><button class="go" onclick="place()">See my placement</button>`;
 if(step==2){const c=cat(ST.agg);h=head('Placement result 🎉',`With aggregate ${ST.agg}, you qualify for ${CN[c]}.`)+`<div class="letter" style="text-align:center"><b style="font-size:20px">${ST.school}</b><br>Placed as a boarding student</div><button class="go" onclick="nx()">Continue</button>`}
 if(step==3)h=head('Pick your programme','What will you study at '+ST.school+'?')+opts(PRG,'prog');
 if(step==4)h=head('Admission letter ✉️','')+`<div class="letter"><b>${ST.school.toUpperCase()}</b><br>Dear Candidate (BECE aggregate ${ST.agg}),<br>You are admitted to <b>SHS 1</b> to read <b>${ST.prog.slice(3)}</b> as a boarder. Report with your trunk, chop box and bucket.<br><br><i>— The Headmaster</i></div><button class="go" onclick="nx()">Report to school</button>`;
 if(step==5){if(!ST.house){const x=HOU[G][Math.floor(Math.random()*4)];ST.house=x[0];ST.hc=x[1]}
  h=head('Your house','Seniors are waiting at the gate.')+`<div style="margin-bottom:10px"><span class="badge" style="background:#${ST.hc.toString(16).padStart(6,'0')}">${ST.house}</span></div><div class="say">👨🏾‍🎓 Senior ${F?'Efua':'Kofi'}: "Freshers! Welcome to ${ST.house}!"<br><br>👩🏾‍🎓 Senior ${F?'Ama':'Yaw'}: "Don't worry, we'll show you the ropes."</div><button class="go" onclick="nx()">Meet the house</button>`}
 if(step==6)h=head('What do they call you?','Type your own nickname or let the seniors decide.')+`<input id="nk" maxlength="14" placeholder="e.g. Sarge" value="${ST.nick}"><button class="opt" style="margin-top:10px;text-align:center" onclick="ST.nick=$('nk').value;rnick()">🎲 Let the seniors pick</button>${ST.nick?`<div class="say" style="margin-top:6px">👨🏾‍🎓 "From today you are <b>${ST.nick}</b>!"</div>`:''}<button class="go" onclick="ST.nick=$('nk').value.trim()||ST.nick||'Newbie';nx()">Next</button>`;
 if(step==7){let c='';for(let i=0;i<15;i++)c+=`<div class="${i===you?'me':''}">${i===you?'YOU':i+1}</div>`;
  h=head('Your dorm','15 beds, bunks in rows.')+`<div class="g">${c}</div><div class="say">🧑🏾 ${RMn()}: "Fourteen of us for this room, ${ST.nick}. Your bed is the orange one."</div><div class="lb" style="margin-top:12px">How will you live as a fresher?</div>${STY.map((x,i)=>`<button class="opt ${ST.style==i?'sel':''}" onclick="ST.style=${i};draw()">${x[0]}<br><small style="font-weight:500;opacity:.7">${x[1]}</small></button>`).join('')}<button class="go" ${ST.style===''?'disabled style="opacity:.4"':''} onclick="start()">Enter the dorm</button>`}
 E.innerHTML=h}
function RMn(){return ST.g=='F'?'Abena':'Kwame'}
function start(){RM=RMn();alive=false;$('ob').classList.add('off');
 const o=STY[ST.style][2];for(const k in o)S[k]=Math.max(0,Math.min(100,S[k]+o[k]));drawStats();
 $('avatar').textContent=ST.g=='F'?'👧🏾':'👦🏾';
 me.clear();const ch=mk(ST);ch.scale.setScalar(.8);me.add(ch);
 cx.clearRect(0,0,128,64);cx.fillStyle='#ff8a1f';cx.beginPath();cx.rect(4,8,120,48);cx.fill();cx.fillStyle='#fff';cx.font='bold 26px sans-serif';cx.textAlign='center';cx.fillText(ST.nick.slice(0,8),64,41);sp.material.map.needsUpdate=true;
 kwame.children[0].material.color.set(ST.g=='F'?0x8e5ad8:0x2ecc71);
 TASKS.kwame[0]='Say hi — tap '+RM;drawTasks();
 ACT.kwame=()=>{S.Social=Math.min(100,S.Social+15);toast('💬 '+RM+': "Eii, '+ST.nick+'!" · Social +15')};
 toast('Welcome, '+ST.nick+' of '+ST.house)}
rb();draw();
</script>
</body></html>
